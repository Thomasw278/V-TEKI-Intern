# Menjalankan MySQL + backend + frontend sekaligus:
#   docker compose up -d --build
#   docker compose exec backend python -m app.seed --demo   (opsional: data demo)
# Buka http://localhost:3000
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: karbonlens
      MYSQL_USER: karbon
      MYSQL_PASSWORD: karbon123
      MYSQL_ROOT_PASSWORD: root123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://karbon:karbon123@mysql:3306/karbonlens?charset=utf8mb4
      JWT_SECRET: ganti-dengan-string-acak-minimal-32-karakter
      CORS_ORIGINS: http://localhost:3000
      STORAGE_DIR: /app/storage
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  uploads:
